<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>$title$</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          'Inter',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
        font-size: 11pt;
        line-height: 1.6;
        color: #1a1a1a;
        padding: 40px 60px;
        max-width: 800px;
        margin: 0 auto;
      }

      /* Headings */
      h1 {
        font-size: 28pt;
        font-weight: 700;
        color: #1e3a5f;
        margin-bottom: 16px;
        margin-top: 32px;
        line-height: 1.2;
      }

      h2 {
        font-size: 20pt;
        font-weight: 600;
        color: #2d5a87;
        margin-bottom: 12px;
        margin-top: 28px;
        line-height: 1.3;
      }

      h3 {
        font-size: 14pt;
        font-weight: 600;
        color: #3d7ab5;
        margin-bottom: 10px;
        margin-top: 24px;
        line-height: 1.4;
      }

      h1:first-child,
      h2:first-child,
      h3:first-child {
        margin-top: 0;
      }

      /* Paragraphs */
      p {
        margin-bottom: 12px;
      }

      /* Links */
      a {
        color: #2d5a87;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      /* Lists */
      ul,
      ol {
        margin-bottom: 12px;
        padding-left: 24px;
      }

      li {
        margin-bottom: 6px;
      }

      /* Images */
      img {
        display: block;
        max-width: 100%;
        height: auto;
        margin: 20px auto;
        border-radius: 4px;
      }

      figure {
        margin: 20px 0;
        text-align: center;
      }

      figcaption {
        font-size: 10pt;
        color: #666;
        margin-top: 8px;
        font-style: italic;
      }

      /* Code */
      code {
        font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Fira Code', monospace;
        font-size: 10pt;
        background-color: #f4f4f5;
        padding: 2px 6px;
        border-radius: 3px;
      }

      pre {
        background-color: #f4f4f5;
        padding: 16px;
        border-radius: 6px;
        overflow-x: auto;
        margin-bottom: 16px;
      }

      pre code {
        background: none;
        padding: 0;
      }

      /* Blockquotes */
      blockquote {
        border-left: 4px solid #2d5a87;
        padding-left: 16px;
        margin: 16px 0;
        color: #4a4a4a;
        font-style: italic;
      }

      /* Tables */
      table {
        width: 100%;
        border-collapse: collapse;
        margin: 16px 0;
      }

      th,
      td {
        border: 1px solid #ddd;
        padding: 10px 12px;
        text-align: left;
      }

      th {
        background-color: #f4f4f5;
        font-weight: 600;
        color: #1e3a5f;
      }

      tr:nth-child(even) {
        background-color: #fafafa;
      }

      /* Horizontal rule */
      hr {
        border: none;
        border-top: 1px solid #ddd;
        margin: 24px 0;
      }

      /* Strong and emphasis */
      strong {
        font-weight: 600;
      }

      em {
        font-style: italic;
      }
    </style>
  </head>
  <body>
    $body$
  </body>
</html>
